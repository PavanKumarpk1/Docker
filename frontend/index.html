<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Step 1: POST Data (API 1)</h3>
        <input type="text" id="userInput" placeholder="Type something here...">
        <button onclick="sendData()">Save to Memory</button>
    </div>

    <div class="box">
        <h3>Step 2: GET Data (API 2)</h3>
        <button onclick="getData()">Refresh List</button>
        <ul id="list"></ul>
    </div>

    <script>
        async function sendData() {
            const val = document.getElementById('userInput').value;
            await fetch('http://34.27.154.69:8001/write', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text_entry: val})
            });
            document.getElementById('userInput').value = ''; // clear box
            alert("Sent via POST!");
        }

        async function getData() {
            const response = await fetch('http://34.27.154.69:8002/read');
            const data = await response.json();
            const list = document.getElementById('list');
            list.innerHTML = data.entries.map(item => `<li>${item}</li>`).join('');
        }
    </script>
</body>
</html>
