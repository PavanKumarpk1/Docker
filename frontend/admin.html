<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bulk Product Manager</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f0f2f5; display: flex; justify-content: center; }
        .admin-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .section { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        h2 { margin-top: 0; color: #333; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="file"] { margin-bottom: 15px; }
        button { 
            width: 100%; padding: 12px; border-radius: 6px; border: none; 
            cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .btn-bulk { background: #6f42c1; color: white; }
        .btn-bulk:hover { background: #59359a; }
        #log { 
            margin-top: 20px; max-height: 200px; overflow-y: auto; 
            font-size: 13px; padding: 10px; background: #222; color: #0f0; border-radius: 4px; display: none;
        }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Bulk Product Upload</h2>
    <div class="section">
        <label>Upload JSON File</label>
        <p style="font-size: 12px; color: #666;">File must be a JSON array of products.</p>
        <input type="file" id="bulkFile" accept=".json">
        <button class="btn-bulk" onclick="handleBulkUpload()">Process Bulk List</button>
    </div>

    <div id="log"></div>
</div>

<script>
    // Update with your actual Server IP
    const API_URL = "http://YOUR_SERVER_IP:8003/products";

    function logMessage(msg) {
        const logDiv = document.getElementById('log');
        logDiv.style.display = "block";
        logDiv.innerHTML += `<div>> ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function handleBulkUpload() {
        const fileInput = document.getElementById('bulkFile');
        const file = fileInput.files[0];
        
        if (!file) {
            alert("Please select a JSON file first!");
            return;
        }

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const products = JSON.parse(e.target.result);
                
                if (!Array.isArray(products)) {
                    logMessage("Error: JSON must be an Array [{}, {}]");
                    return;
                }

                logMessage(`Found ${products.length} products. Starting upload...`);

                for (let item of products) {
                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(item)
                        });

                        if (response.ok) {
                            logMessage(`✅ Added: ${item.name}`);
                        } else {
                            logMessage(`❌ Product error occurred for ${item.name}: ${response.statusText}`);
                        }
                    } catch (err) {
                        logMessage(`❌ Failed to reach API for ${item.name}`);
                    }
                }
                logMessage("--- Bulk Processing Finished ---");

            } catch (err) {
                logMessage("❌ Error: Invalid JSON file format.");
            }
        };
        reader.readAsText(file);
    }
</script>

</body>
</html>
