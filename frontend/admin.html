<!DOCTYPE html>
<html>
<head>
    <title>Product Manager</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; width: 100%; }
        button:hover { background: #218838; }
        #status { margin-top: 10px; color: blue; }
    </style>
</head>
<body>
    <h2>Manage Store Products</h2>
    <div class="card">
        <h3>Add New Product</h3>
        <input type="text" id="name" placeholder="Product Name (e.g. GPU)">
        <input type="number" id="price" placeholder="Price (e.g. 299)">
        <input type="text" id="url" placeholder="Image URL (from Icons8)">
        <button onclick="addProduct()">Add Product</button>
        <div id="status"></div>
    </div>

    <script>
        async function addProduct() {
            const data = {
                name: document.getElementById('name').value,
                price: parseInt(document.getElementById('price').value),
                image_url: document.getElementById('url').value
            };

            const response = await fetch('http://YOUR_SERVER_IP:8003/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                document.getElementById('status').innerText = "✅ Success! Product added.";
                document.getElementById('name').value = '';
            } else {
                document.getElementById('status').innerText = "❌ Error adding product.";
            }
        }
    </script>
</body>
</html>
