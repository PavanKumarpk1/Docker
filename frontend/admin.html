<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Store Admin Dashboard</title>
    <style>
        :root { --primary: #6f42c1; --secondary: #4a90e2; --danger: #dc3545; --success: #28a745; --dark: #212529; }
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; background: #f8f9fa; color: #333; }
        
        /* Navigation */
        nav { background: var(--dark); color: white; padding: 1rem 2rem; display: flex; gap: 25px; align-items: center; position: sticky; top: 0; z-index: 1000; }
        nav h1 { margin: 0; font-size: 1.2rem; flex-grow: 1; color: var(--secondary); }
        nav a { color: #adb5bd; text-decoration: none; font-weight: 500; cursor: pointer; transition: 0.2s; }
        nav a:hover, nav a.active { color: white; }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 30px; }
        
        /* Search */
        .search-container { margin-bottom: 20px; }
        .search-bar { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 16px; outline: none; transition: 0.3s; box-sizing: border-box; }
        .search-bar:focus { border-color: var(--secondary); }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; background: #fdfdfd; padding: 15px; border-bottom: 2px solid #eee; color: #666; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; }
        
        .prod-img { width: 50px; height: 50px; object-fit: contain; border-radius: 6px; background: #f0f0f0; }
        .edit-input { width: 100%; padding: 8px; border: 1px solid var(--secondary); border-radius: 4px; box-sizing: border-box; margin-bottom: 4px; }
        
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .btn-edit { background: #e7f1ff; color: var(--secondary); }
        .btn-del { background: #fff5f5; color: var(--danger); }
        .btn-save { background: var(--success); color: white; }
        .btn-cancel { background: #6c757d; color: white; }

        .hidden { display: none; }
        .action-group { display: flex; gap: 8px; }
    </style>
</head>
<body>

<nav>
    <h1>Store Admin Pro</h1>
    <a onclick="showSection('manage')" id="nav-manage" class="active">Inventory</a>
    <a onclick="showSection('add')" id="nav-add">Add Products</a>
</nav>

<div class="container">
    
    <!-- SECTION: ADD / BULK -->
    <div id="section-add" class="card hidden">
        <h2>Manual Entry</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 15px; align-items: end; margin-bottom: 30px;">
            <div><label>Name</label><input type="text" id="p-name" class="edit-input" style="border: 1px solid #ddd;"></div>
            <div><label>Price</label><input type="number" id="p-price" class="edit-input" style="border: 1px solid #ddd;"></div>
            <div><label>Image URL</label><input type="text" id="p-url" class="edit-input" style="border: 1px solid #ddd;"></div>
            <button class="btn btn-save" onclick="manualAdd()" style="padding:10px 25px;">Add Product</button>
        </div>

        <div style="padding-top: 20px; border-top: 1px dashed #ccc;">
            <h3>JSON Bulk Import</h3>
            <input type="file" id="bulkFile" accept=".json">
            <button id="uploadBtn" class="btn" style="background:var(--primary); color:white;">Start Upload</button>
        </div>
    </div>

    <!-- SECTION: INVENTORY -->
    <div id="section-manage" class="card">
        <div class="search-container">
            <input type="text" class="search-bar" id="searchInput" placeholder="Search by product name..." onkeyup="filterProducts()">
        </div>

        <table>
            <thead>
                <tr>
                    <th width="80">Image</th>
                    <th>Product Details</th>
                    <th width="150">Price</th>
                    <th width="180">Actions</th>
                </tr>
            </thead>
            <tbody id="product-list">
                <!-- Loaded via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "http://34.27.154.69:8003/products";
    let allProducts = [];

    // --- SECTION SWITCHING ---
    function showSection(section) {
        document.getElementById('section-add').classList.toggle('hidden', section !== 'add');
        document.getElementById('section-manage').classList.toggle('hidden', section !== 'manage');
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        document.getElementById(`nav-${section}`).classList.add('active');
        if(section === 'manage') fetchProducts();
    }

    // --- FETCH & RENDER ---
    async function fetchProducts() {
        try {
            const res = await fetch(API_URL);
            allProducts = await res.json();
            renderTable(allProducts);
        } catch (e) { console.error("Fetch Error:", e); }
    }

    function renderTable(data) {
        const tbody = document.getElementById('product-list');
        tbody.innerHTML = data.map((p, index) => `
            <tr id="row-${index}">
                <td><img src="${p.image_url}" class="prod-img"></td>
                <td>
                    <div class="view-mode"><strong>${p.name}</strong></div>
                    <div class="edit-mode hidden">
                        <input type="text" class="edit-input" id="edit-name-${index}" value="${p.name}">
                        <input type="text" class="edit-input" id="edit-url-${index}" value="${p.image_url}" style="font-size:11px;">
                    </div>
                </td>
                <td>
                    <div class="view-mode">$${p.price}</div>
                    <div class="edit-mode hidden"><input type="number" class="edit-input" id="edit-price-${index}" value="${p.price}"></div>
                </td>
                <td>
                    <div class="view-mode action-group">
                        <button class="btn btn-edit" onclick="toggleEdit(${index}, true)">Edit</button>
                        <button class="btn btn-del" onclick="deleteProduct('${p.name}')">Delete</button>
                    </div>
                    <div class="edit-mode action-group hidden">
                        <button class="btn btn-save" onclick="saveEdit(${index}, '${p.name}')">Save</button>
                        <button class="btn btn-cancel" onclick="toggleEdit(${index}, false)">Cancel</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    // --- CORE ACTIONS ---
    function filterProducts() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
        renderTable(filtered);
    }

    function toggleEdit(index, isEditing) {
        const row = document.getElementById(`row-${index}`);
        row.querySelectorAll('.view-mode').forEach(el => el.classList.toggle('hidden', isEditing));
        row.querySelectorAll('.edit-mode').forEach(el => el.classList.toggle('hidden', !isEditing));
    }

    async function saveEdit(index, oldName) {
        const newName = document.getElementById(`edit-name-${index}`).value;
        const newPrice = document.getElementById(`edit-price-${index}`).value;
        const newUrl = document.getElementById(`edit-url-${index}`).value;

        // Simulate Update: Delete then POST
        await fetch(`${API_URL}/${encodeURIComponent(oldName)}`, { method: 'DELETE' });
        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: newName, price: parseInt(newPrice), image_url: newUrl })
        });
        fetchProducts();
    }

    async function deleteProduct(name) {
        if(!confirm(`Delete ${name}?`)) return;
        await fetch(`${API_URL}/${encodeURIComponent(name)}`, { method: 'DELETE' });
        fetchProducts();
    }

    async function manualAdd() {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const url = document.getElementById('p-url').value;
        if(!name || !price) return alert("Fill Name and Price");

        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, price: parseInt(price), image_url: url })
        });
        document.getElementById('p-name').value = '';
        document.getElementById('p-price').value = '';
        document.getElementById('p-url').value = '';
        showSection('manage');
    }

    // --- BULK UPLOAD (Wired with EventListener for reliability) ---
    document.getElementById('uploadBtn').addEventListener('click', async () => {
        const fileInput = document.getElementById('bulkFile');
        const file = fileInput.files[0];
        if (!file) return alert("Select a JSON file!");

        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const products = JSON.parse(e.target.result);
                for (const item of products) {
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(item)
                    });
                }
                alert("Bulk Upload Complete!");
                fileInput.value = "";
                showSection('manage');
            } catch (err) { alert("JSON Error: " + err.message); }
        };
        reader.readAsText(file);
    });

    // Initial load
    fetchProducts();
</script>

</body>
</html>
